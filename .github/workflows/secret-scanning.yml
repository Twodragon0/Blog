name: "Secret Scanning"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    # 매일 오전 2시 (UTC)에 실행
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 전체 스캔이 히스토리를 필요로 한다
          fetch-depth: 0

      # TruffleHog 의 base/head 는 **diff 스캔**용이라 PR 에서만 성립한다.
      # 예전에는 이벤트 구분 없이 base=default_branch · head=HEAD 를 줬는데,
      # push·schedule 에서는 그 둘이 같은 커밋이라 액션이 아래 오류로 즉시 실패했다.
      #
      #   BASE and HEAD commits are the same. TruffleHog won't scan anything.
      #
      # 스캔을 한 번도 못 하고 매일 빨간불만 띄웠다. 이벤트별로 갈라 준다.

      - name: Scan pull request diff
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      - name: Scan full repository
        if: github.event_name != 'pull_request'
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          path: ./
          # base/head 를 주지 않으면 저장소 전체를 스캔한다. 스케줄 실행에서 원하는 동작이고,
          # diff 스캔으로는 이미 머지된 과거 커밋의 유출을 영영 못 잡는다.
          extra_args: --only-verified
